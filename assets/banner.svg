<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d17" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#060913" />
    </linearGradient>

    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="purple-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f355da" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#7000ff" stop-opacity="0.1" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="cyber-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.6" />
    </pattern>

    <!-- Filter for soft glow -->
    <filter id="glow-effect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 46px;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 20px;
        letter-spacing: 0.2px;
      }
      .tagline-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 14px;
        letter-spacing: 0.5px;
      }
      .badge-label {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
      }

      /* Dynamic Ambient Animations in Background */
      @keyframes floatOrb1 {
        0% { transform: translate(0px, 0px) scale(1); opacity: 0.45; }
        50% { transform: translate(60px, 40px) scale(1.15); opacity: 0.7; }
        100% { transform: translate(0px, 0px) scale(1); opacity: 0.45; }
      }
      @keyframes floatOrb2 {
        0% { transform: translate(0px, 0px) scale(1); opacity: 0.35; }
        50% { transform: translate(-50px, -30px) scale(1.2); opacity: 0.6; }
        100% { transform: translate(0px, 0px) scale(1); opacity: 0.35; }
      }
      @keyframes scanBeam {
        0% { transform: translateY(-100px); opacity: 0; }
        50% { opacity: 0.35; }
        100% { transform: translateY(420px); opacity: 0; }
      }
      @keyframes pulseNode {
        0%, 100% { r: 4px; opacity: 0.5; }
        50% { r: 6.5px; opacity: 1; filter: drop-shadow(0 0 6px #38bdf8); }
      }
      @keyframes dashStream {
        to { stroke-dashoffset: -100; }
      }

      .animated-orb-1 {
        animation: floatOrb1 9s ease-in-out infinite;
      }
      .animated-orb-2 {
        animation: floatOrb2 11s ease-in-out infinite;
      }
      .animated-scan {
        animation: scanBeam 6s ease-in-out infinite;
      }
      .pulse-dot {
        animation: pulseNode 3s ease-in-out infinite;
      }
      .data-stream {
        stroke-dasharray: 8 6;
        animation: dashStream 4s linear infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="400" fill="url(#bg-grad)" rx="16" />

  <!-- Animated Glowing Background Orbs (Behind Text) -->
  <g filter="url(#glow-effect)">
    <circle class="animated-orb-1" cx="220" cy="110" r="160" fill="url(#cyan-glow)" />
    <circle class="animated-orb-2" cx="980" cy="270" r="180" fill="url(#purple-glow)" />
    <circle class="animated-orb-1" cx="800" cy="80" r="130" fill="#3b82f6" opacity="0.25" />
  </g>

  <!-- Cybernetic Grid Overlay -->
  <rect width="1200" height="400" fill="url(#cyber-grid)" rx="16" opacity="0.65" />

  <!-- Dynamic Scanning Laser (Background decoration) -->
  <line class="animated-scan" x1="0" y1="0" x2="1200" y2="0" stroke="url(#title-grad)" stroke-width="2" />

  <!-- Automation Diagram / Circuit Nodes (Dynamic Background Elements) -->
  <g opacity="0.45" stroke="#38bdf8" stroke-width="1.5" fill="none">
    <path d="M 80,60 L 160,60 L 210,110 L 320,110" class="data-stream" />
    <path d="M 1120,340 L 1020,340 L 960,290 L 850,290" class="data-stream" />
    <path d="M 900,90 L 1050,90 L 1100,140" class="data-stream" />
  </g>
  <circle cx="210" cy="110" r="4" fill="#38bdf8" class="pulse-dot" />
  <circle cx="960" cy="290" r="4" fill="#c084fc" class="pulse-dot" />
  <circle cx="1050" cy="90" r="4" fill="#38bdf8" class="pulse-dot" />

  <!-- Decorative Top Banner Tag / Pill -->
  <g transform="translate(425, 42)">
    <rect width="350" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6" />
    <circle cx="20" cy="16" r="5" fill="#10b981" />
    <text x="35" y="21" fill="#94a3b8" class="badge-label" font-size="12">THE SOVEREIGN WEB AGENT STACK</text>
  </g>

  <!-- Main Foreground Content (Carefully placed so it never gets obscured) -->
  <g id="foreground-content">
    <!-- Title -->
    <text x="600" y="140" text-anchor="middle" fill="url(#title-grad)" class="title-text">
      Awesome AI Browser Automation
    </text>
    <text x="600" y="190" text-anchor="middle" fill="#f8fafc" class="title-text" font-size="36">
      &amp; Web Scraping
    </text>

    <!-- Subtitle -->
    <text x="600" y="240" text-anchor="middle" fill="#94a3b8" class="subtitle-text">
      The Curated Matrix of Autonomous Web Agents, Headless Browser Fleets &amp; LLM Scrapers
    </text>

    <text x="600" y="272" text-anchor="middle" fill="#64748b" class="tagline-text">
      Crawl4AI • Firecrawl • Browser-Use • Playwright • Stagehand • Steel.dev • Zyte • Apify
    </text>

    <!-- Feature Badges / Interactive Look Cards in Foreground -->
    <g transform="translate(180, 310)">
      <!-- Card 1 -->
      <g transform="translate(0, 0)">
        <rect width="185" height="42" rx="8" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="1.2" />
        <text x="92" y="26" text-anchor="middle" fill="#38bdf8" class="badge-label">🤖 AI Web Agents</text>
      </g>
      <!-- Card 2 -->
      <g transform="translate(215, 0)">
        <rect width="195" height="42" rx="8" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="1.2" />
        <text x="97" y="26" text-anchor="middle" fill="#818cf8" class="badge-label">⚡ Headless Browser Infra</text>
      </g>
      <!-- Card 3 -->
      <g transform="translate(440, 0)">
        <rect width="185" height="42" rx="8" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="1.2" />
        <text x="92" y="26" text-anchor="middle" fill="#c084fc" class="badge-label">📄 Clean Markdown LLM</text>
      </g>
      <!-- Card 4 -->
      <g transform="translate(655, 0)">
        <rect width="185" height="42" rx="8" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="1.2" />
        <text x="92" y="26" text-anchor="middle" fill="#34d399" class="badge-label">🛡️ Stealth &amp; Anti-Detect</text>
      </g>
    </g>
  </g>
</svg>
